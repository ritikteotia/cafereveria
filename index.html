<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Cafe Reveria</title>
    <!-- FontAwesome for professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Clean, minimal reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f1110; 
            color: #fcfcfc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding-top: 60px; /* Prevents menu from hiding behind the sticky header */
        }

        /* --- 1. Sticky Header --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #0b0d0c;
            border-bottom: 2px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-brand {
            font-size: 18px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-actions a {
            color: #fcfcfc;
            margin-left: 20px;
            font-size: 20px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .header-actions a:hover {
            color: #d4af37;
        }

        /* --- 2. Main Menu Container --- */
        .menu-container {
            max-width: 500px; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0f1110;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-wrap {
            background-color: #fcfcfc;
            padding: 15px;
        }

        /* --- 3. Functional Footer --- */
        footer {
            max-width: 500px;
            margin: 20px auto 0;
            background-color: #151716;
            padding: 35px 20px;
            border-top: 1px solid #2a2c2b;
            text-align: center;
        }

        .footer-title {
            color: #d4af37;
            font-size: 16px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .social-icons {
            margin-bottom: 25px;
        }

        .social-icons a {
            color: #fcfcfc;
            font-size: 24px;
            margin: 0 12px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #d4af37;
        }
        
        .footer-info {
            font-size: 14px;
            line-height: 1.8;
            color: #cccccc;
            margin-bottom: 25px;
        }

        .footer-info i {
            margin-right: 8px;
            color: #d4af37;
            width: 16px;
        }

        .sustainability-note {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            font-style: italic;
        }

        /* Footer Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }

        .btn-wifi {
            background-color: #2a2c2b;
            color: #ffffff;
            border: 1px solid #3a3c3b;
        }
    </style>
</head>
<body>

    <!-- Sticky Header -->
    <header>
        <div class="header-brand">Cafe Reveria</div>
        <div class="header-actions">
            <!-- Smooth scroll to footer contact info -->
            <a href="#contact-footer"><i class="fas fa-phone-alt"></i></a>
            <a href="https://instagram.com/cafereveria" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
    </header>

    <!-- Main Images -->
    <div class="menu-container">
        <img src="ChatGPT Image Jun 4, 2026, 10_16_51 PM.png" alt="Epic Combos">
        <img src="ChatGPT Image Jun 4, 2026, 10_04_44 PM.png" alt="Full Menu">
    </div>

    <!-- Highly Functional Footer -->
    <footer id="contact-footer">
        <h3 class="footer-title">Your Everyday Spot</h3>
        
        <div class="social-icons">
            <a href="https://instagram.com/cafereveria" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-google"></i></a>
        </div>

        <div class="footer-info">
            <p><i class="fas fa-map-marker-alt"></i> Agra, Uttar Pradesh</p>
            <p><i class="far fa-clock"></i> Open Today: 11:00 AM - 11:00 PM</p>
            <p><i class="fas fa-leaf"></i> 100% Pure Veg</p>
            <p class="sustainability-note">Thanks for using our contactless menu to support a greener planet! 🌱</p>
        </div>

        <div class="action-buttons">
            <!-- Pulls the exact number from your graphic -->
            <a href="https://wa.me/919193344177" class="btn btn-whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> Order via WhatsApp
            </a>
            <!-- Simple JavaScript pop-up so you don't need a whole separate page for Wi-Fi -->
            <a href="#" class="btn btn-wifi" onclick="alert('WiFi Network: Excitel_Cafe Reveria 5g \nPassword: '); return false;">
                <i class="fas fa-wifi"></i> Get Free Wi-Fi
            </a>
        </div>
    </footer>

</body>
</html>
